
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071427">
<title>資訊漣漪｜數位公民挑戰</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --bg: #071427;
  --panel: #10243c;
  --panel2: #172f4c;
  --cyan: #6be8ff;
  --gold: #f3d28d;
  --white: #f3f9ff;
  --muted: #b1c5d8;
  --green: #49d9ac;
  --red: #ff7386;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--white);
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
}

button, input, select { font: inherit; }
button { cursor: pointer; }

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 3px;
}

#tech-background {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

#app {
  width: min(1180px, calc(100% - 32px));
  margin: 36px auto 90px;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 345px;
  gap: 26px;
  align-items: start;
}

.card {
  padding: 32px;
  border: 1px solid rgba(107,232,255,.24);
  border-radius: 24px;
  background: linear-gradient(
    145deg,
    rgba(16,36,60,.96),
    rgba(9,24,43,.94)
  );
  box-shadow: 0 20px 60px #0005;
  backdrop-filter: blur(16px);
}

.intro {
  min-height: 75vh;
  display: grid;
  place-items: center;
}

.intro .card {
  width: min(790px, 100%);
  text-align: center;
  padding: 65px 48px;
}

h1 {
  margin: 14px 0;
  font-size: clamp(48px, 8vw, 92px);
  letter-spacing: .12em;
  background: linear-gradient(100deg, #fff, #7deeff, #f4d18c);
  color: transparent;
  background-clip: text;
}

h2 {
  font-size: clamp(24px, 3.5vw, 34px);
  line-height: 1.5;
  margin: 12px 0 20px;
}

h3 { font-size: 19px; margin: 16px 0; }

p {
  line-height: 1.9;
  color: var(--muted);
}

.eyebrow {
  color: var(--cyan);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .17em;
}

.progress {
  height: 6px;
  margin: 14px 0 22px;
  background: #203b55;
  border-radius: 20px;
  overflow: hidden;
}

.progress > div {
  height: 100%;
  background: linear-gradient(90deg, #4f8dff, #6be8ff);
  transition: width .4s;
}

.btn, .choice {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 20px;
  margin: 5px;
  color: var(--white);
  background: #24435f;
  border: 1px solid #4a7796;
  border-radius: 12px;
  transition: background .2s, transform .2s;
}

.btn:hover, .choice:hover {
  background: #315b7d;
  border-color: var(--cyan);
  transform: translateY(-2px);
}

.btn.primary {
  background: linear-gradient(110deg, #176fa0, #239ab3);
  border-color: #60dfff;
  font-weight: 800;
}

.btn.good {
  background: #176e60;
  border-color: #44d8b0;
}

.btn.danger {
  background: #793047;
  border-color: #ff8597;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 22px;
}

.actions .btn, .choice {
  width: 100%;
  margin: 0;
  justify-content: flex-start;
  text-align: left;
}

.choice {
  display: block;
  margin: 10px 0;
  line-height: 1.6;
}

.post, .notice, .history-item {
  padding: 19px;
  border: 1px solid #315471;
  border-radius: 15px;
  background: rgba(28,54,80,.72);
  margin: 18px 0;
}

.post small { color: var(--cyan); }
.post p { color: #f0f8ff; }

.notice {
  border-left: 4px solid var(--cyan);
  line-height: 1.8;
  color: #d9edf8;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.stat {
  padding: 14px 10px;
  text-align: center;
  background: #12283fdf;
  border: 1px solid #2b5471;
  border-radius: 14px;
}

.stat small {
  display: block;
  font-size: 12px;
  color: var(--muted);
}

.stat strong {
  font-size: 27px;
  color: var(--cyan);
}

.field {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 9px 0 17px;
  border: 1px solid #7194ad;
  border-radius: 10px;
  background: #eaf5ff;
  color: #11283c;
}

.cert-preview {
  width: 100%;
  margin: 16px 0;
  border: 1px solid var(--gold);
  border-radius: 10px;
}

.history-item h3 { color: var(--cyan); }

/* ===== 模擬手機 ===== */

.phone-col {
  position: sticky;
  top: 20px;
  min-width: 0;
}

.phone {
  width: 100%;
  height: 660px;
  position: relative;
  overflow: hidden;
  border: 7px solid #253d56;
  border-radius: 37px;
  background: #101b30;
  box-shadow: 0 20px 50px #0009, 0 0 0 2px #53718c;
}

.statusbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 42px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  color: white;
  background: #14243b;
  font-size: 11px;
  cursor: pointer;
}

.notch {
  width: 70px;
  height: 16px;
  background: #050b15;
  border-radius: 0 0 14px 14px;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

.screen {
  position: absolute;
  inset: 42px 0 28px;
  overflow: hidden;
  background: linear-gradient(155deg, #173e63, #101f39 60%, #193858);
}

.homebar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 28px;
  display: grid;
  place-items: center;
  background: #101b30;
}

.homebar button {
  width: 95px;
  height: 5px;
  padding: 0;
  background: #e8f0fa;
  border: 0;
  border-radius: 8px;
}

.desktop {
  height: 100%;
  padding: 50px 18px 15px;
  text-align: center;
  overflow-y: auto;
  background:
    radial-gradient(circle at 65% 20%, #378ab244, transparent 45%),
    linear-gradient(150deg, #17456a, #12263f 75%);
}

.desktop-time {
  font-size: 52px;
  font-weight: 800;
}

.desktop-date {
  font-size: 12px;
  color: #b9d4e9;
}

.apps {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px 16px;
  margin-top: 62px;
}

.appicon {
  border: 0;
  background: transparent;
  color: white;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.appicon span {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: linear-gradient(140deg, #2d9cb5, #27518e);
  box-shadow: 0 8px 18px #0004;
}

.desktop-tip {
  margin-top: 55px;
  font-size: 11px;
  color: #c2d7e7;
}

.page {
  height: 100%;
  padding: 15px;
  overflow-y: auto;
  background: #f0f5fa;
  color: #203549;
}

.page h3 { font-size: 16px; }
.page p { color: #42566b; font-size: 13px; }

.apphead {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  padding-bottom: 12px;
  border-bottom: 1px solid #cbd7e3;
}

.mini {
  border: 0;
  background: #dce8f3;
  color: #1d425d;
  padding: 8px;
  border-radius: 9px;
  font-size: 12px;
}

.item {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 1px solid #d5e1eb;
  border-radius: 12px;
  background: white;
  color: #253d51;
  text-align: left;
  line-height: 1.6;
  font-size: 13px;
}

.item small {
  display: block;
  color: #5585a0;
  font-size: 11px;
}

.article {
  padding: 15px;
  background: white;
  border-radius: 13px;
}

.chathead {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.avatar {
  width: 39px;
  height: 39px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #c7ddec;
}

.bubbles {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bubble {
  align-self: flex-start;
  max-width: 88%;
  padding: 9px 13px;
  border-radius: 14px 14px 14px 3px;
  background: white;
  box-shadow: 0 2px 6px #0001;
}

.bubble.mine {
  align-self: flex-end;
  border-radius: 14px 14px 3px 14px;
  background: #b9f3d5;
}

.bubble small {
  font-size: 10px;
  color: #4c788a;
}

.bubble p {
  margin: 3px 0;
  color: #23384a;
  line-height: 1.6;
  font-size: 12px;
}

/* ===== 通知中心 ===== */

.shade {
  position: absolute;
  inset: 0;
  z-index: 80;
  padding: 15px;
  overflow-y: auto;
  color: #fff;
  background: rgba(21,35,56,.98);
  transform: translateY(-105%);
  transition: transform .3s ease;
  pointer-events: none;
}

.shade.open {
  transform: translateY(0);
  pointer-events: auto;
}

.shade-handle {
  width: 50px;
  height: 5px;
  margin: 0 auto 18px;
  background: #8196ad;
  border-radius: 10px;
}

.tiles {
  display: flex;
  gap: 9px;
  margin: 17px 0;
}

.tile {
  flex: 1;
  padding: 13px 6px;
  background: #365473;
  border-radius: 12px;
  font-size: 11px;
  text-align: center;
}

.notification {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 9px 0;
  border: 1px solid #ffffff24;
  border-radius: 14px;
  background: #40536d;
  color: white;
  text-align: left;
}

.notification small {
  display: block;
  color: #c4d2df;
  font-size: 10px;
}

.notification strong {
  display: block;
  margin: 4px 0;
  font-size: 12px;
}

.notification p {
  color: #eef5fc;
  font-size: 11px;
  margin: 0;
  line-height: 1.6;
}

.phone-backdrop,
.phone-launcher {
  display: none;
}

/* ===== 真實頂部橫幅通知 ===== */

.live-notification {
  position: absolute;
  top: 8px;
  left: 10px;
  right: 10px;
  z-index: 120;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px;
  border: 1px solid #ffffff35;
  border-radius: 17px;
  background: rgba(48,64,85,.97);
  color: #fff;
  box-shadow: 0 12px 25px #0007;
  backdrop-filter: blur(18px);
  cursor: pointer;
  transform: translateY(-150%);
  opacity: 0;
  animation: bannerIn .4s ease forwards;
}

.live-notification.hide {
  animation: bannerOut .38s ease forwards;
}

.live-notification-icon {
  flex: 0 0 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #218b72;
  font-size: 21px;
}

.live-notification-content {
  flex: 1;
  min-width: 0;
}

.live-notification-title {
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 4px;
}

.live-notification-body {
  font-size: 11px;
  line-height: 1.5;
  color: #e2edf7;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}

.live-notification-time {
  font-size: 10px;
  color: #c3d2df;
}

@keyframes bannerIn {
  from {
    transform: translateY(-150%);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes bannerOut {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-150%);
    opacity: 0;
  }
}

/* ===== 來電畫面：保留深藍科技風 ===== */

.call {
  position: relative;
  height: 100%;
  padding: 58px 20px 24px;
  text-align: center;
  color: white;
  background: linear-gradient(
    165deg,
    #293d5c 0%,
    #1c2b48 65%,
    #111d35 100%
  );
}

.call-avatar {
  width: 110px;
  height: 110px;
  display: grid;
  place-items: center;
  margin: 15px auto 25px;
  border-radius: 50%;
  background: #536a85;
  box-shadow: 0 0 0 19px #ffffff12;
  font-size: 55px;
}

.ringing .call-avatar {
  animation: ringPulse 1.3s ease-in-out infinite;
}

.call-name {
  font-size: 23px;
  font-weight: 800;
}

.call-number {
  font-size: 13px;
  color: #c4d6e8;
  margin-top: 10px;
}

.call-status {
  margin: 25px 0;
  color: #a5d4e5;
}

.call-actions {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 82px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 55px;
}

.call-btn {
  width: 72px;
  height: 72px;
  border: 0;
  border-radius: 50%;
  color: white;
  font-size: 30px;
  box-shadow: 0 10px 24px #0006;
  transition: filter .2s, box-shadow .2s;
}

.call-btn.reject {
  background: #d85567;
  animation: rejectFloat 2.5s ease-in-out infinite;
}

.call-btn.accept {
  background: #59b87d;
  animation: acceptFloat 2.5s ease-in-out infinite;
}

.call-btn:hover {
  filter: brightness(1.15);
  box-shadow: 0 14px 32px #0008;
}

@keyframes rejectFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

@keyframes acceptFloat {
  0%, 100% { transform: translateY(-12px); }
  50% { transform: translateY(0); }
}

@keyframes ringPulse {
  50% {
    transform: scale(1.06);
    box-shadow: 0 0 0 26px #ffffff13;
  }
}

.voice-indicator {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 28px;
  color: #a7c5dc;
  font-size: 11px;
}

.voice-waves {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 22px;
  margin: 8px 0;
}

.voice-waves span {
  width: 4px;
  height: 8px;
  border-radius: 5px;
  background: #6be8ff;
  animation: wave 1s ease-in-out infinite alternate;
}

.voice-waves span:nth-child(2) { animation-delay: .2s; }
.voice-waves span:nth-child(3) { animation-delay: .4s; }
.voice-waves span:nth-child(4) { animation-delay: .15s; }
.voice-waves span:nth-child(5) { animation-delay: .35s; }

@keyframes wave {
  from { height: 5px; }
  to { height: 20px; }
}

/* ===== 購物網站 ===== */

.shop {
  position: relative;
  isolation: isolate;
  min-height: 510px;
  overflow: hidden;
  margin: 20px 0;
  border: 2px solid #d5e0e8;
  border-radius: 16px;
  background: #f6f8fa;
  color: #243548;
}

.shophead {
  padding: 15px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.shophead strong {
  font-size: 14px;
  color: #244c68;
}

.shopsearch {
  padding: 9px;
  background: #edf3f6;
  border-radius: 9px;
  font-size: 11px;
}

.banner {
  padding: 14px;
  background: linear-gradient(90deg, #ff4c69, #ffab38);
  color: white;
  font-weight: 900;
  text-align: center;
}

.product {
  display: flex;
  gap: 20px;
  padding: 20px;
  background: white;
  color: #26384b;
}

.product-pic {
  width: 115px;
  height: 115px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 15px;
  background: linear-gradient(140deg, #c5f0ff, #f5e0ff);
  font-size: 65px;
}

.price {
  font-size: 27px;
  font-weight: 900;
  color: #e64b56;
}

.shop-description {
  padding: 12px 20px;
}

.shop-description p {
  color: #40566b;
  font-size: 12px;
}

.shop-buy {
  display: flex;
  gap: 10px;
  padding: 12px 20px;
}

.shop-buy button,
.popup-action {
  padding: 10px 13px;
  border: 0;
  border-radius: 8px;
  color: white;
  background: #e64c58;
  font-weight: 800;
}

.shop-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.shop-footer span {
  color: var(--cyan);
  font-size: 13px;
}

/* ===== 不同形式的廣告 ===== */

.popup {
  position: absolute;
  width: clamp(170px, 42%, 245px);
  min-height: 140px;
  max-height: 245px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow: hidden;
  border: 2px solid #f59e54;
  border-radius: 12px;
  background: #fff;
  color: #263448;
  box-shadow: 0 9px 30px #0006;
  animation: popupAppear .25s ease both;
}

.popup strong {
  padding-right: 20px;
  font-size: 13px;
  line-height: 1.35;
}

.popup p {
  margin: 3px 0;
  color: #344c60;
  font-size: 11px;
  line-height: 1.4;
}

.popup .popup-action {
  margin-top: auto;
  font-size: 11px;
  min-height: 31px;
}

.popup-close {
  position: absolute;
  top: 4px;
  right: 5px;
  z-index: 3;
  width: 25px;
  height: 25px;
  border: 0;
  border-radius: 50%;
  background: #243b52;
  color: white;
  font-size: 18px;
}

.popup.visual {
  background: linear-gradient(145deg, #fff3ce, #ffd5e7);
  border: 3px solid #ff8c36;
}

.popup.security {
  background: linear-gradient(145deg, #fff, #ffe3e7);
  border: 3px solid #d83c4c;
}

.popup.flash {
  background: linear-gradient(135deg, #391b64, #b82d76);
  color: white;
  border: 2px solid #ffe25a;
  animation: adFlash .7s ease-in-out infinite alternate;
}

.popup.flash p { color: white; }

.popup.floating {
  background: #e3faff;
  border: 2px solid #35b8d5;
  animation: adFloat 1.8s ease-in-out infinite alternate;
}

.popup.countdown {
  background: linear-gradient(135deg, #fff, #ffdbb1);
  border: 3px solid #ee7a2e;
}

.ad-art {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60px;
  border-radius: 9px;
  background: radial-gradient(circle, #fff, #b5e4f6);
  font-size: 48px;
}

.ad-art span {
  filter: drop-shadow(0 5px 5px #0004);
}

.ad-discount {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 6px;
  background: #e73d50;
  color: white;
  font-weight: 800;
  font-size: 12px;
}

.ad-countdown {
  color: #b62c36;
  font-size: 17px;
  font-weight: 900;
}

.ad-security-icon {
  text-align: center;
  font-size: 40px;
  animation: adWarning 1s infinite;
}

@keyframes popupAppear {
  from { transform: scale(.75); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes adFlash {
  from {
    box-shadow: 0 0 8px #f4c852;
    filter: brightness(1);
  }
  to {
    box-shadow: 0 0 26px #ffde57;
    filter: brightness(1.23);
  }
}

@keyframes adFloat {
  from { transform: translateY(-5px); }
  to { transform: translateY(8px); }
}

@keyframes adWarning {
  50% { transform: scale(1.14); }
}

/* ===== 電影式漸暗轉場 ===== */

.shop-overlay {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 25px;
  background: rgba(1,8,20,.94);
  color: white;
  text-align: center;
  animation: fadeDark 1.1s ease both;
}

.cinematic-message {
  max-width: 530px;
  animation: cinematicEnter 1.2s ease both;
}

.cinematic-message h2 {

audio.ring.volume = .65;
audio.message.volume = .55;
audio.ring.loop = true;
audio.bgm.loop = true;
audio.bgm.volume = .22;

function startBGM() {
  if (!audio.enabled) return;
  audio.bgm.play().catch(() => {});
}

function playSound(type) {
  if (!audio.enabled || !audio[type]) return;

  if (type === "message") {
    if (Date.now() - audio.lastMessage < 350) return;
    audio.lastMessage = Date.now();
  }

  const sound = audio[type];

  try {
    if (type !== "ring") {
      sound.pause();
      sound.currentTime = 0;
    }
    sound.play().catch(() => {});
  } catch (error) {
    console.warn("音效無法播放：", type, error);
  }
}

  audio.ring.pause();
  audio.ring.currentTime = 0;
}

  if (currentCallVoice) {
    currentCallVoice.pause();
    currentCallVoice.currentTime = 0;
    currentCallVoice = null;
  }
  if (audio.bgm) audio.bgm.volume = .22;
  updateVoiceIndicator();
}

  const indicator = document.getElementById("voiceIndicator");
  if (indicator) {
    indicator.textContent = currentCallVoice
      ? "正在播放客服錄音……" : "客服錄音待命";

/* ===== 遊戲狀態 ===== */

let state;
let phone;
let shopTimer = null;
let swipeStart = null;

const BANNER_DURATION = 4000;
let bannerTimer = null;
let bannerHideTimer = null;
let activeBanner = null;
let bannerQueue = [];
let bannerSerial = 0;

const stage = () => stages[state.stage];
const clamp = n => Math.max(0, Math.min(100, n));

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function btn(label, action, style = "") {
  return `
    <button class="btn ${style}"
      data-action="${action}">
      ${label}
    </button>`;
}

/* ===== 通知 ===== */

function notificationIcon(type) {
  if (type === "chat") return "💬";
  if (type === "mail") return "✉️";
  if (type === "facts") return "🔎";
  return "🔔";
}

function bannerHTML() {
  if (!activeBanner) return "";

  const n = activeBanner;

  return `
    <div class="live-notification"
      data-notification="${escapeHTML(n.id)}">
      <div class="live-notification-icon">
        ${notificationIcon(n.type)}
      </div>
      <div class="live-notification-content">
        <div class="live-notification-title">
          ${escapeHTML(n.title)}
        </div>
        <div class="live-notification-body">
          ${escapeHTML(n.body)}
        </div>
      </div>
      <div class="live-notification-time">現在</div>
    </div>`;
}

function clearNotificationBanners() {
  clearTimeout(bannerTimer);
  clearTimeout(bannerHideTimer);
  activeBanner = null;
  bannerQueue = [];
}

function updateBannerDOM() {
  const screen = document.querySelector(".phone .screen");
  if (!screen) return;

  screen.querySelector(".live-notification")?.remove();

  if (activeBanner) {
    screen.insertAdjacentHTML("beforeend", bannerHTML());
  }
}

function showNextBanner() {
  if (activeBanner || bannerQueue.length === 0) return;

  activeBanner = bannerQueue.shift();
  updateBannerDOM();

  bannerTimer = setTimeout(
    hideNotificationBanner,
    BANNER_DURATION
  );
}

function showNotificationBanner(notification) {
  bannerQueue.push(notification);
  showNextBanner();
}

function hideNotificationBanner() {
  if (!activeBanner) return;

  clearTimeout(bannerTimer);

  const banner = document.querySelector(".live-notification");
  if (banner) banner.classList.add("hide");

  bannerHideTimer = setTimeout(() => {
    activeBanner = null;
    updateBannerDOM();
    showNextBanner();
  }, 400);
}

function dismissActiveBanner() {
  clearTimeout(bannerTimer);
  clearTimeout(bannerHideTimer);
  activeBanner = null;
  updateBannerDOM();
  showNextBanner();
}

function notify(type, title, body, which = state.stage) {
  const notification = {
    id: `notification-${++bannerSerial}`,
    type,
    title,
    body,
    stage: which,
    read: false
  };

  phone.notifications.unshift(notification);
  playSound("message");
  showNotificationBanner(notification);
}

function addMessage(sender, text) {
  phone.messages.unshift({ sender, text });
  playSound("message");
}

  clearTimeout(shopTimer);
  clearNotificationBanners();
  stopRing();
  stopCharacterSpeech();
  audio.bgm.pause();
  audio.bgm.currentTime = 0;

  state = {
    scene: "home",
    stage: 0,
    judgment: 50,
    trust: 50,
    checks: 0,
    checkedCurrent: false,
    selected: 0,
    infoAnswer: -1,
    newsChecked: [],
    newsAnswer: null,
    history: [],
    reviewPage: 0,

    chatNode: "start",
    chatMessages: [],
    chatDone: false,
    chatVerified: false,

    callNode: "intro",
    callStatus: "ringing",
    callHistory: [],
    callDone: false,
    callVerified: false,

    shopAds: [],
    shopId: 0,
    shopClosed: 0,
    shopPhase: "normal",
    shopStart: 0,
    shopOutcome: null,

    simulatedWarning: false,
    securityReviewed: false,

    learnerName: "",
    certStyle: "certificate"
  };

  phone = {
    open: window.innerWidth > 850,
    app: "home",

    readStages: new Set()
  };

function navigate(scene) {
  state.scene = scene;
  render();
  window.scrollTo(0, 0);
}

function prepareStage() {
  const s = stage();

  phone.shade = false;
  phone.articleStage = null;

  if (state.stage === 1) {
    phone.app = "video";
    const previous = state.history.find(h => h.stage === 1);

    if (previous) {
      const message = previous.risky
        ? "你昨天說停課，結果學校說正常上課耶！"
        : "還好你提醒大家查證，不然我們差點相信了！";

      addMessage("小宇", message);
      notify("chat", "小宇", message);
    }
  }

  if (state.stage === 4) {
    const previous = state.history.find(h => h.stage === 3);

    if (previous) {
      notify(
        "chat",
        "朋友的提醒",
        previous.risky
          ? "你之前是不是點過奇怪的購物廣告？要小心喔！"
          : "你之前有先查證商品資訊，這樣比較安心。"
      );
    }
  }

  if (s.type === "article") {
    phone.app = state.stage === 1 ? "video" : "home";

    if (state.stage === 0) {
      notify("chat", "班級群組・小宇", s.post);
      addMessage("班級群組", s.post);
    } else if (state.stage === 1) {
      notify("chat", "熱門影片分享", s.post);
      addMessage("熱門影片分享", s.post);
    } else {
      notify("mail", "限時購物優惠", s.post);
    }
  }

  if (s.type === "news") {
    state.newsChecked = [];
    state.newsSelected = null;
    state.newsAnswer = null;
    phone.app = "home";
  }

  if (s.type === "chat") {
    state.chatNode = "start";
    state.chatMessages = [];
    state.chatDone = false;
    state.chatVerified = false;
    phone.app = "chat";

    enterChat("start");
  }

  if (s.type === "call") {
    state.callNode = "intro";
    state.callStatus = "ringing";
    state.callHistory = [];
    state.callDone = false;
    state.callVerified = false;
    phone.app = "home";

    startRing();
  }
}

function openNotification(id) {
  const n = phone.notifications.find(x => x.id === id);
  if (!n) return;

  n.read = true;
  phone.shade = false;
  phone.open = true;

  if (n.type === "facts") {
    phone.articleStage = n.stage;
    phone.app = "article";
  } else {
    phone.app =
      n.type === "chat" ? "chat" :
      n.type === "mail" ? "mail" :
      n.type === "system" ? "facts" :
      "home";
  }

  render();
}

function finishEvidence() {
  const index = phone.articleStage;

  if (index !== state.stage ||
      phone.readStages.has(index)) return;

  phone.readStages.add(index);
  state.checkedCurrent = true;
  state.checks++;
  state.judgment = clamp(state.judgment + 4);

  phone.app = "facts";
  render();
}

function reviewSecurity() {
  if (!state.simulatedWarning ||
      state.securityReviewed) return;

  state.securityReviewed = true;
  state.checks++;
  state.judgment = clamp(state.judgment + 5);

  notify(
    "system",
    "安全說明完成",
    "你已了解如何辨識可疑安全警告。"
  );

  render();
}

function addAd() {
  const template = adTemplates[
    Math.floor(Math.random() * adTemplates.length)
  ];

  state.shopAds.push({
    ...template,
    id: ++state.shopId,
    x: Math.random() * 52,
    y: Math.random() * 69
  });
}

function startShop() {
  clearTimeout(shopTimer);

  state.shopAds = [];
  state.shopId = 0;
  state.shopClosed = 0;
  state.shopPhase = "normal";
  state.shopStart = 0;
  state.shopOutcome = null;

  addAd();
  addAd();

  navigate("shop");
}

function closeAd(id) {
  if (state.shopPhase !== "normal") return;

  const index = state.shopAds.findIndex(
    ad => ad.id === id
  );

  if (index === -1) return;

  state.shopAds.splice(index, 1);
  state.shopClosed++;

  if (state.shopClosed >= SHOP_SAFE_LIMIT) {
    triggerSafeTransition();
    return;
  }

  addAd();

  if (state.shopClosed % 3 === 0) addAd();

  if (state.shopAds.length > 8) {
    state.shopAds.shift();
  }

  render();
}

function triggerSafeTransition() {
  if (state.shopPhase !== "normal") return;

  clearTimeout(shopTimer);

  state.shopOutcome = "safe";
  state.shopPhase = "transition";
  state.judgment = clamp(state.judgment + 8);
  state.trust = clamp(state.trust + 5);

  notify(
    "system",
    "謹慎操作紀錄",
    "你沒有點擊可疑廣告，成功避免誤觸。"
  );

  render();

  shopTimer = setTimeout(() => {
    if (state.scene === "shop") {
      navigate("question");
    }
  }, 4300);
}

function triggerChaos() {
  if (state.shopPhase !== "normal") return;

  clearTimeout(shopTimer);

  state.shopOutcome = "chaos";
  state.shopPhase = "chaos";
  state.shopStart = Date.now();
  state.shopAds = [];
  state.simulatedWarning = true;
  state.securityReviewed = false;

  notify(
    "system",
    "模擬安全異常",
    "可疑網站出現大量廣告與假安全警告。"
  );

  shopTick();
}

function shopTick() {
  if (state.scene !== "shop" ||
      state.shopPhase !== "chaos") return;

  const elapsed = Date.now() - state.shopStart;

  const targetCount = Math.min(
    SHOP_CHAOS_LIMIT,
    3 + Math.floor(elapsed / 115)
  );

  while (state.shopAds.length < targetCount) {
    addAd();
  }

  if (elapsed >= 4500) {
    state.shopPhase = "transition";
    render();

    shopTimer = setTimeout(() => {
      if (state.scene === "shop") {
        navigate("question");
      }
    }, 4300);

    return;
  }

  render();
  shopTimer = setTimeout(shopTick, 115);
}

function dialogueData() {
  return state.stage === 4
    ? groupDialogue
    : friendDialogue;
}

function enterChat(id) {
  const node = dialogueData()[id];
  if (!node) return;

  state.chatNode = id;

  if (
    state.stage === 4 &&
    ["independent","warn","verifiedLeave"].includes(id)
  ) {
    state.chatVerified = true;
  }

  if (
    state.stage === 6 &&
    ["verify","mutualFriend","protectAccount","warnFriends"]
      .includes(id)
  ) {
    state.chatVerified = true;
  }

  const messages = node.messages || [];
  state.chatMessages.push(...messages);

  const incoming = messages.filter(m =>
    m[0] !== "你" && m[0] !== "系統"
  );

  if (incoming.length) {
    const last = incoming[incoming.length - 1];

    notify(
      "chat",
      state.stage === 4
        ? "福氣分享交流會"
        : "好友・阿哲",
      `${last[0]}：${last[1]}`
    );
  }

  if (node.ending) {
    finishChat(node.ending);
  }
}

function chooseChat(i) {
  if (state.chatDone) return;

  const option = dialogueData()[state.chatNode].choices?.[i];
  if (!option) return;

  state.chatMessages.push(["你", option[0]]);
  enterChat(option[1]);
  render();
}

function finishChat(result) {
  if (state.chatDone) return;

  state.chatDone = true;

  const safe = result === "safe";
  const leave = result === "leave";

  const impact = state.stage === 4
    ? safe ? [16,12] : leave ? [12,10] : [-12,-8]
    : safe ? [18,14] : [-16,-12];

  state.judgment = clamp(
    state.judgment + impact[0]
  );
  state.trust = clamp(
    state.trust + impact[1]
  );

  if (state.chatVerified) state.checks++;

  state.history.push({
    stage: state.stage + 1,
    title: stage().title,
    choice: safe
      ? "謹慎處理可疑訊息"
      : leave
        ? "退出陌生群組"
        : "相信未經查證的資訊",
    checked: state.chatVerified,
    risky: result === "risky",
    impact: [...impact]
  });
}

function renderChat() {
  const node = dialogueData()[state.chatNode];

  layout(`
    <div class="eyebrow">${stage().topic}</div>
    <h2>${stage().title}</h2>
    <p>${stage().story}</p>

    ${state.chatDone ? `
      <div class="notice">
        ${stage().lesson}

        "進入下一階段 →",

  `);
}

/* ===== 第五階段：語音電話 ===== */

function acceptCall() {
  if (state.callStatus !== "ringing") return;

  stopRing();
  state.callStatus = "active";

  render();
  speakCallNode();
}

function finishCall(result) {
  if (state.callDone) return;

  stopRing();
  stopCharacterSpeech();

  state.callDone = true;
  state.callStatus = "ended";

  if (state.callVerified) {
    state.checks++;
    state.judgment = clamp(state.judgment + 5);
  }

  const impact = {
    safe: [16,12],
    warning: [10,8],
    rejected: [8,6],
    hungup: [12,10]
  }[result] || [8,6];

  state.judgment = clamp(
    state.judgment + impact[0]
  );
  state.trust = clamp(
    state.trust + impact[1]
  );

  state.history.push({
    stage: 6,
    title: stage().title,
    choice: result === "rejected"
      ? "拒接陌生來電"
      : result === "hungup"
        ? "主動掛斷"
        : result === "safe"
          ? "拒絕提供驗證碼"
          : "及時察覺可疑要求",
    checked: state.callVerified,
    risky: false,
    impact: [impact[0] + (state.callVerified ? 5 : 0), impact[1]]
  });

  navigate("callOutcome");
}

function chooseCall(i) {
  if (state.callDone) return;
  const node = callDialogue[state.callNode];
  const option = node.choices?.[i];
  if (!option) return;

  stopCharacterSpeech();
  state.callHistory.push(
    [node.speaker, node.text],
    ["你", option[0]]
  );
  state.callNode = option[1];

  if (["officialApp", "officialWebsite", "officialSupport"]
      .includes(option[1])) {
    state.callVerified = true;
  }

  const next = callDialogue[state.callNode];
  if (next.ending) {
    state.callHistory.push([next.speaker, next.text]);
    finishCall(next.ending);
    return;
  }

  render();
  // 僅播放詐騙客服的真人錄音；玩家與旁白不配音
  speakCallNode();
}

}

  return "具備風險意識：下次可再補強獨立查證";
}

/* ===== JPG / PDF 證書 ===== */

function certificateCanvas(name, style) {
  const passport = style === "passport";
  const canvas = document.createElement("canvas");

  canvas.width = passport ? 1000 : 1600;
  canvas.height = passport ? 1450 : 1050;

  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;

  const font =
    '"Noto Sans TC","Microsoft JhengHei",sans-serif';

  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, "#091a32");
  grad.addColorStop(.5, "#153b5a");
  grad.addColorStop(1, "#0c213b");

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = "rgba(100,210,240,.10)";
  ctx.lineWidth = 1;

  for (let x=0; x<w; x+=50) {
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,h);
    ctx.stroke();
  }

  for (let y=0; y<h; y+=50) {
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }

  ctx.strokeStyle = "#d5b773";
  ctx.lineWidth = 7;
  ctx.strokeRect(42,42,w-84,h-84);

  ctx.strokeStyle = "#6bd8e7";
  ctx.lineWidth = 2;
  ctx.strokeRect(61,61,w-122,h-122);

  function write(text,y,size,color="#ffffff",weight=500) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.fillText(text,cx,y,w-160);
  }

  function line(y) {
    ctx.strokeStyle = "#d5b773";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(130,y);
    ctx.lineTo(w-130,y);
    ctx.stroke();
  }

  const date = new Date().toLocaleDateString("zh-TW",{
    year:"numeric",
    month:"long",
    day:"numeric"
  });

  const score = Math.round(
    state.judgment * .55 + state.trust * .45
  );

  if (!passport) {
    write("INFORMATION RIPPLE",155,35,"#83e8ef",700);
    write("資訊漣漪",265,92,"#ffffff",700);
    write("數位公民學習證書",360,48,"#e9c982",700);
    line(420);
    write("茲紀錄學習者",485,29,"#c9e2f1");
    write(name,565,68,"#ffffff",700);
    write("已完成七階段數位公民挑戰",660,32);
    write(
      `學習成果分數 ${score} ｜ 查證紀錄 ${state.checks} 次`,
      740,27,"#8ee2e6"
    );
    line(810);
    write(`完成日期：${date}`,865,27,"#e6d3a7");
    write(
      "本文件為互動遊戲學習成果紀錄，非正式認證",
      948,20,"#b4c5d6"
    );
  } else {
    write("INFORMATION RIPPLE",155,29,"#8be7ee",700);
    write("資訊旅人",255,77,"#ffffff",700);
    write("數位學習護照",345,48,"#e9c982",700);
    line(410);
    write("PASSPORT HOLDER",475,24,"#8ce1e9");
    write(name,550,58,"#ffffff",700);
    write("七階段媒體識讀旅程",655,30,"#e6d3a7");

    [
      "01 校園停課傳聞",
      "02 AI 影像迷局",
      "03 購物網站陷阱",
      "04 新聞文章摘要判讀",
      "05 群組裡的真相",
      "06 客服來電危機",
      "07 熟悉的陌生人"
    ].forEach((x,i) => {
      write("✓  " + x,735+i*65,27);
    });

    line(1180);
    write(`學習成果分數：${score}`,1230,27,"#8ce1e9");
    write(`完成日期：${date}`,1290,24,"#e9c982");
    write(
      "遊戲學習紀錄・非正式認證",
      1380,19,"#b7cbdc"
    );
  }

  return canvas;
}

async function certificateAction(format) {
  const input = document.getElementById("learnerName");
  const select = document.getElementById("certStyle");
  const message = document.getElementById("certMessage");

  if (!input || !select) return;

  const name = input.value.trim();

  if (!name) {
    message.textContent = "請先輸入姓名。";
    input.focus();
    return;
  }

  state.learnerName = name;
  state.certStyle = select.value;

  if (document.fonts?.ready) {
    await document.fonts.ready;
  }

  const canvas = certificateCanvas(name, select.value);
  const jpg = canvas.toDataURL("image/jpeg", .95);

  if (format === "preview") {
    const area = document.getElementById("previewArea");

    area.innerHTML = `
      <img class="cert-preview" alt="學習成果預覽">
    `;

    area.querySelector("img").src = jpg;

    message.textContent =
      "預覽已更新，可以下載 JPG 或 PDF。";
    return;
  }

  const filename = select.value === "passport"
    ? "資訊漣漪_數位護照"
    : "資訊漣漪_學習證書";

  if (format === "jpg") {
    const a = document.createElement("a");
    a.href = jpg;
    a.download = filename + ".jpg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }

  if (!window.jspdf?.jsPDF) {
    message.textContent =
      "PDF 函式庫未載入，請檢查網路連線。";
    return;
  }

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF({
    orientation: select.value === "passport"
      ? "portrait"
      : "landscape",
    unit: "mm",
    format: "a4"
  });

  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();

  const ratio = Math.min(
    pw / canvas.width,
    ph / canvas.height
  );

  const iw = canvas.width * ratio;
  const ih = canvas.height * ratio;

  pdf.addImage(
    jpg,
    "JPEG",
    (pw-iw)/2,
    (ph-ih)/2,
    iw,
    ih
  );

  pdf.save(filename + ".pdf");
}

  switch (state.scene) {
    case "home": renderHome(); break;
    case "story": renderStory(); break;
    case "decision": renderDecision(); break;
    case "outcome": renderOutcome(); break;
    case "shop": renderShop(); break;

    case "newsOutcome": renderNewsOutcome(); break;
    case "chat": renderChat(); break;
    case "call": renderCall(); break;
    case "callOutcome": renderCallOutcome(); break;

  }
}

/* ===== 按鈕事件 ===== */

app.addEventListener("click", async e => {
  const newsClaim = e.target.closest("[data-news-claim]");
  const ad = e.target.closest("[data-ad]");
  const chat = e.target.closest("[data-chat-choice]");
  const call = e.target.closest("[data-call-choice]");
  const note = e.target.closest("[data-notification]");
  const article = e.target.closest("[data-article]");
  const element = e.target.closest("[data-action]");

  if (!newsClaim && !ad && !chat && !call &&
      !note && !article && !element) return;

  const firstAudioInteraction = !audio.enabled;
  audio.enabled = true;
  if (firstAudioInteraction) startBGM();
  playSound("click");

  if (newsClaim) {
    showNewsEvidence(Number(newsClaim.dataset.newsClaim));
    return;
  }

  if (ad) {
    closeAd(Number(ad.dataset.ad));
    return;
  }

  if (chat) {
    chooseChat(Number(chat.dataset.chatChoice));
    return;
  }

  if (call) {
    chooseCall(Number(call.dataset.callChoice));
    return;
  }

  if (note) {
    const id = note.dataset.notification;

    if (activeBanner?.id === id) {
      dismissActiveBanner();
    }

    openNotification(id);
    return;
  }

  if (article) {
    phone.articleStage = Number(article.dataset.article);
    phone.app = "article";
    phone.shade = false;
    render();
    return;
  }

  const action = element.dataset.action;

  if (action === "start") {
    resetGame();
    audio.enabled = true;
    startBGM();
    prepareStage();
    navigate("story");
  }
  else if (action === "decision") {
    navigate("decision");
  }
  else if (action === "requestEvidence") {
    requestEvidence();
  }
  else if (action === "finishEvidence") {
    finishEvidence();
  }
  else if (action === "reviewSecurity") {
    reviewSecurity();
  }
  else if (action === "next") {
    nextStage();
  }
  else if (action === "news") {
    navigate("news");
  }
  else if (action === "startShop") {
    startShop();
  }
  else if (action === "leaveShop") {
    clearTimeout(shopTimer);
    state.shopOutcome = "left";
    navigate("question");
  }
  else if (action === "shopTrap") {
    triggerChaos();
  }
  else if (action === "acceptCall") {
    acceptCall();
  }
  else if (action === "rejectCall") {
    finishCall("rejected");
  }
  else if (action === "hangupCall") {
    finishCall("hungup");
  }
  else if (action === "replaySpeech") {
    speakCallNode();
  }
  else if (action === "reviewAgain") {
    state.reviewPage = 0;
    navigate("review");
  }
  else if (action === "reviewNext") {
    state.reviewPage = Math.min(7, state.reviewPage + 1);
    navigate("review");
  }
  else if (action === "reviewPrev") {
    state.reviewPage = Math.max(0, state.reviewPage - 1);
    navigate("review");
  }
  else if (/^review-[0-7]$/.test(action)) {
    state.reviewPage = Number(action.split("-")[1]);
    navigate("review");
  }
  else if (action === "history") {
    navigate("history");
  }
  else if (action === "ending") {
    navigate("ending");
  }
  else if (action.startsWith("newsAnswer-")) {
    submitNewsAnswer(Number(action.split("-")[1]));
  }
  else if (action.startsWith("choose-")) {
    choose(Number(action.split("-")[1]));
  }
  else if (action.startsWith("info-")) {
    state.infoAnswer = Number(action.split("-")[1]);
    navigate("reflection");
  }
  else if (action === "openPhone") {
    phone.open = true;
    render();
  }
  else if (action === "closePhone") {
    phone.open = false;
    phone.shade = false;
    render();
  }
  else if (action === "toggleShade") {
    phone.shade = !phone.shade;
    render();
  }
  else if (action === "closeShade") {
    phone.shade = false;
    render();
  }
  else if (action === "clearRead") {
    phone.notifications =
      phone.notifications.filter(n => !n.read);
    render();
  }
  else if (action === "app-home") {
    phone.app = "home";
    phone.shade = false;
    render();
  }
  else if (action.startsWith("app-")) {
    phone.app = action.slice(4);
    phone.shade = false;
    render();
  }
  else if (action === "openShopFromPhone") {
    if (state.stage === 2 &&
        state.scene === "story") {
      startShop();
    } else {
      phone.app = "browser";
      render();
    }
  }
  else if (action === "previewCert") {
    await certificateAction("preview");
  }
  else if (action === "downloadJPG") {
    await certificateAction("jpg");
  }
  else if (action === "downloadPDF") {
    await certificateAction("pdf");
  }
});

/* ===== 通知中心滑動 ===== */

app.addEventListener("pointerdown", e => {
  const top = e.target.closest("#swipeArea");
  const shade = e.target.closest(".shade");

  if (top || shade) {
    swipeStart = {
      x: e.clientX,
      y: e.clientY,
      fromShade: !!shade
    };
  }
});

app.addEventListener("pointerup", e => {
  if (!swipeStart) return;

  const dy = e.clientY - swipeStart.y;
  const dx = e.clientX - swipeStart.x;
  const fromShade = swipeStart.fromShade;

  swipeStart = null;

  if (Math.abs(dy) < 35 ||
      Math.abs(dy) < Math.abs(dx)) return;

  if (dy > 35 && !fromShade) {
    phone.shade = true;
  } else if (dy < -35 && fromShade) {
    phone.shade = false;
  }

  render();
});

app.addEventListener("pointercancel", () => {
  swipeStart = null;
});

/* ===== 動態科技背景 ===== */

(function initializeTechBackground() {
  const canvas = document.getElementById("tech-background");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  let width = 0;
  let height = 0;
  let particles = [];
  let animationId = null;

  const mouse = { x: -1000, y: -1000 };

  const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  const config = {
    particleCount: 85,
    connectionDistance: 145,
    mouseDistance: 180,
    particleSpeed: .35,
    gridSize: 65
  };

  class Particle {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.radius = Math.random() * 1.8 + .7;
      this.vx = (Math.random()-.5) * config.particleSpeed * 2;
      this.vy = (Math.random()-.5) * config.particleSpeed * 2;
      this.alpha = Math.random() * .45 + .35;
      this.phase = Math.random() * Math.PI * 2;
    }

    update(time) {
      this.x += this.vx;
      this.y += this.vy;
      this.x += Math.sin(time*.0005+this.phase)*.08;

      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const distance = Math.hypot(dx,dy);

      if (distance > 0 &&
          distance < config.mouseDistance) {
        const force = (
          config.mouseDistance-distance
        ) / config.mouseDistance;

        this.x += dx/distance*force*.65;
        this.y += dy/distance*force*.65;
      }

      if (this.x < -10) this.x = width+10;
      if (this.x > width+10) this.x = -10;
      if (this.y < -10) this.y = height+10;
      if (this.y > height+10) this.y = -10;
    }

    draw(time) {
      const glow = (
        Math.sin(time*.002+this.phase)+1
      )/2;

      ctx.beginPath();
      ctx.arc(
        this.x,
        this.y,
        this.radius,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        `rgba(110,225,255,${this.alpha+glow*.18})`;

      ctx.shadowBlur = 12;
      ctx.shadowColor = "#43d8ff";
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function resizeCanvas() {
    const dpr = Math.min(
      window.devicePixelRatio || 1,
      2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width*dpr);
    canvas.height = Math.round(height*dpr);

    canvas.style.width = width+"px";
    canvas.style.height = height+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    particles = Array.from({
      length: width < 650
        ? 35
        : config.particleCount
    }, () => new Particle());
  }

  function drawGrid(time) {
    const grid = config.gridSize;
    const offsetX = time*.006%grid;
    const offsetY = time*.003%grid;

    ctx.lineWidth = .6;
    ctx.strokeStyle = "rgba(77,165,225,.075)";

    for (let x=offsetX; x<width; x+=grid) {
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x,height);
      ctx.stroke();
    }

    for (let y=offsetY; y<height; y+=grid) {
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(width,y);
      ctx.stroke();
    }
  }

  function drawConnections() {
    for (let i=0; i<particles.length; i++) {
      for (let j=i+1; j<particles.length; j++) {
        const a = particles[i];
        const b = particles[j];

        const distance = Math.hypot(
          a.x-b.x,
          a.y-b.y
        );

        if (distance < config.connectionDistance) {
          const opacity = (
            1-distance/config.connectionDistance
          )*.24;

          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.strokeStyle =
            `rgba(82,202,255,${opacity})`;
          ctx.lineWidth = .8;
          ctx.stroke();
        }
      }
    }
  }

  function drawMouseGlow() {
    if (mouse.x < 0 || mouse.y < 0) return;

    const gradient = ctx.createRadialGradient(
      mouse.x,mouse.y,0,
      mouse.x,mouse.y,180
    );

    gradient.addColorStop(
      0,
      "rgba(65,195,255,.13)"
    );

    gradient.addColorStop(
      1,
      "rgba(65,195,255,0)"
    );

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(
      mouse.x,
      mouse.y,
      180,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  function drawFrame(time) {
    ctx.clearRect(0,0,width,height);

    drawGrid(time);
    drawMouseGlow();

    for (const p of particles) {
      p.update(time);
    }

    drawConnections();

    for (const p of particles) {
      p.draw(time);
    }

    animationId = requestAnimationFrame(drawFrame);
  }

  function drawStaticFrame() {
    ctx.clearRect(0,0,width,height);
    drawGrid(0);
    drawConnections();

    for (const p of particles) {
      p.draw(0);
    }
  }

  function updateMotionPreference() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    if (reduceMotion.matches) {
      drawStaticFrame();
    } else {
      animationId = requestAnimationFrame(drawFrame);
    }
  }

  window.addEventListener(
    "mousemove",
    e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    },
    { passive: true }
  );

  window.addEventListener("mouseout", e => {
    if (!e.relatedTarget) {
      mouse.x = -1000;
      mouse.y = -1000;
    }
  });

  window.addEventListener("resize", () => {
    resizeCanvas();
    updateMotionPreference();
  });

  reduceMotion.addEventListener(
    "change",
    updateMotionPreference
  );

  resizeCanvas();
  updateMotionPreference();
})();

/* ===== 啟動遊戲 ===== */

resetGame();
render();

</script>
